name: keep-awake

# Render's free web services sleep after 15 minutes without traffic, and waking one takes about a minute.
# The API keeps itself awake and Vercel wakes it each morning; this is a backup, since GitHub runs schedules hours late.
# No runs are scheduled during the API's quiet hours, 03:00-07:00 Hong Kong time (19:00-23:00 UTC).
on:
  schedule:
    - cron: "*/10 0-18,23 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --max-time 120 --retry 2 "${{ vars.KEEP_AWAKE_URL || 'https://gymlun-api.onrender.com/healthz/live' }}"
