# Render Blueprint for the gymlun API: the Docker image on a free web service.
# The database is Neon (free), and the frontend is served by Vercel, which proxies API paths here.
services:
  - type: web
    name: gymlun-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz/live
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: ForwardedHosts__0
        value: gymlun.vercel.app
      - key: Mcp__Enabled
        value: "true"
      - key: Mcp__BaseUrl
        value: https://gymlun.vercel.app
      # Keeps the free service awake, except 03:00-07:00 Hong Kong time; Vercel wakes it again each morning
      - key: KeepAwake__Url
        value: https://gymlun-api.onrender.com/healthz/live
      - key: KeepAwake__TimeZone
        value: Asia/Hong_Kong
      - key: KeepAwake__QuietFrom
        value: "03:00"
      - key: KeepAwake__QuietUntil
        value: "07:00"
      - key: ConnectionStrings__Default
        sync: false
      - key: Auth__AllowedEmails__0
        sync: false
      - key: GoogleAuth__ClientId
        sync: false
      - key: GoogleAuth__ClientSecret
        sync: false
